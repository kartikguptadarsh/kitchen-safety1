    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>School Safety Monitor</title>
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --danger: #e74c3c; --safe: #2ecc71; --header: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { background: var(--header); color: white; width: 100%; padding: 20px; text-align: center; font-weight: bold; font-size: 1.4em; }
        .container { width: 95%; max-width: 500px; margin-top: 20px; }
        .card { background: var(--card); border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; }
        .label { color: #7f8c8d; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .value { font-size: 3em; font-weight: bold; transition: all 0.3s ease; }
        .status { font-size: 1.5em; font-weight: bold; margin-top: 10px; }
        .safe { color: var(--safe); }
        .danger { color: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">SMART KITCHEN MONITOR</div>

    <div class="container">
        <div class="card">
            <div class="label">LPG Concentration (V1)</div>
            <div id="gasDisplay" class="value safe">--</div>
        </div>

        <div class="card">
            <div class="label">Fire Safety (V2)</div>
            <div id="fireStatus" class="status safe">LOADING...</div>
        </div>

        <div class="card">
            <div class="label">Cooking Timer (V3)</div>
            <div id="timerStatus" class="status safe">READY</div>
        </div>
    </div>

    <script>
// Replace your entire <script> section with this
const token = "-72u75kO1HKgqwvWgHqB2icaD3ocOhtX";
const apiBase = `https://blynk.cloud/external/api/get?token=${token}`;

let gasAlertSent = false, fireAlertSent = false, timerAlertSent = false;

async function updateDashboard() {
    // This 'ts' part forces the browser to get fresh data every 3 seconds
    const cb = `&ts=${Date.now()}`; 
    try {
        // 1. Gas Notification (V1)
        const gRes = await fetch(apiBase + "&v1" + cb);
        const gVal = parseInt(await gRes.text());
        if (gVal > 2800 && !gasAlertSent) {
            sendPush("⚠️ GAS LEAK", `High LPG concentration: ${gVal}`);
            gasAlertSent = true;
        } else if (gVal <= 2800) { gasAlertSent = false; }

        // 2. Fire Notification (V2)
        const fRes = await fetch(apiBase + "&v2" + cb);
        const fVal = (await fRes.text()).trim();
        if (fVal === "1" && !fireAlertSent) {
            sendPush("🔥 FIRE ALERT", "Kitchen is vacant and fire detected!");
            fireAlertSent = true;
        } else if (fVal === "0") { fireAlertSent = false; }

        // 3. Timer Notification (V3)
        const tRes = await fetch(apiBase + "&v3" + cb);
        const tVal = (await tRes.text()).trim();
        if (tVal === "1" && !timerAlertSent) {
            sendPush("⏰ TIMER", "Cooking complete!");
            timerAlertSent = true;
        } else if (tVal !== "1") { timerAlertSent = false; }

    } catch (err) { console.log("Blynk Connection Error"); }
}

function sendPush(title, message) {
    if (typeof webpushr !== 'undefined') {
        webpushr('action', 'custom_notification', {
            title: title,
            message: message
        });
    }
}

setInterval(updateDashboard, 3000);

// Crucial: This links the sw.js file to your browser
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
    </script>
</body>
